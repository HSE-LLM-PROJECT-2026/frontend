apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hse-llm-project
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: ClusterIP
  # For demo access without Ingress, switch to NodePort and add nodePort (for example 30080).
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
