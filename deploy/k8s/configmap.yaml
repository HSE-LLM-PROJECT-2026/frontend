apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: hse-llm-project
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_min_length 1024;
      gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

      location = /livez {
        default_type application/json;
        return 200 '{"status":"ok"}';
      }

      location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
      }

      location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
      }

      location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
      }

      location ~* \.(?:css|js|mjs|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
